# Harness看板（HarnessKanban）本地管理与远程 Agent 入口（DEVELOP D19，product 17）

# 远程入口：只转发 AgentAPI。/api/web/v1 绝不在此代理上暴露。
server {
    listen 8443 ssl;
    server_name agent.example.internal;

    ssl_certificate     /etc/nginx/certs/agent.crt;
    ssl_certificate_key /etc/nginx/certs/agent.key;

    # AGENT_TOKEN 含下划线；Nginx 默认丢弃带下划线的请求头，
    # 不打开该指令会让所有合法 Agent 请求认证失败。
    underscores_in_headers on;

    client_max_body_size 21m;

    location /api/agent/v1/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 显式转发鉴权头，避免被中间层改名。
        proxy_set_header AGENT_TOKEN $http_agent_token;
        proxy_pass_request_headers on;
        proxy_read_timeout 60s;
    }

    location = /health/live {
        proxy_pass http://127.0.0.1:8001/health/live;
    }

    location / {
        return 404;
    }
}

# 本机管理入口：只监听回环，不对外发布。WebUI 静态资源与同源 WebAPI 代理。
server {
    listen 127.0.0.1:8080;
    server_name 127.0.0.1;

    root /srv/harvesstask/frontend/dist;
    index index.html;

    location /api/web/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
