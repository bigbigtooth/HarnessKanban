<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0b1c">
<title>Soda Aliens · 汽水星人任务局</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='2' width='44' height='44' rx='15' fill='%23191331'/%3E%3Cpath d='M24 11c9 0 15 5.5 15 13.7 0 9.4-6.7 15.3-15 15.3S9 34.1 9 24.7C9 16.5 15 11 24 11Z' fill='%23d8ff66'/%3E%3Cellipse cx='18.5' cy='25' rx='2.8' ry='3.6' fill='%23211a3a'/%3E%3Cellipse cx='29.5' cy='25' rx='2.8' ry='3.6' fill='%23211a3a'/%3E%3Cpath d='M20 32c2.4 2.2 5.6 2.2 8 0' fill='none' stroke='%23211a3a' stroke-width='2.2' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='7.5' r='2.4' fill='%23ff8ad8'/%3E%3C/svg%3E">
<style>
  /* =========================================================
     SODA ALIENS — a neon cosmic task club
     A single-file demo. No external assets, fonts, or libraries.
     ========================================================= */
  :root {
    --ink: #223b3d;
    --ink-soft: #3c5557;
    --muted: #778b8d;
    --faint: #9aacad;
    --canvas: #f2fbf6;
    --paper: #ffffff;
    --glass: rgba(255, 255, 255, .68);
    --glass-strong: rgba(255, 255, 255, .86);
    --line: #e5efec;
    --line-strong: #d5e7e1;
    --mint: #9ee7ca;
    --mint-soft: #dcf8ec;
    --mint-deep: #24856b;
    --mint-ink: #1f6c58;
    --sky: #b8ddff;
    --sky-soft: #e7f4ff;
    --lav: #d8c9ff;
    --lav-soft: #f1ebff;
    --lemon: #ffe49c;
    --lemon-soft: #fff8df;
    --peach: #ffc8ad;
    --rose: #ffc3d2;
    --coral: #f37866;
    --danger: #c54f62;
    --shadow-xs: 0 1px 2px rgba(40, 80, 76, .03);
    --shadow-sm: 0 3px 10px rgba(50, 94, 89, .05), 0 1px 2px rgba(50, 94, 89, .03);
    --shadow-md: 0 14px 34px rgba(50, 100, 94, .09), 0 3px 8px rgba(50, 100, 94, .04);
    --shadow-lg: 0 30px 80px rgba(30, 67, 63, .22), 0 8px 24px rgba(30, 67, 63, .08);
    --display: "SF Pro Rounded", "Hiragino Maru Gothic ProN", ui-rounded, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --ease-out: cubic-bezier(.22, 1, .36, 1);
    --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--body);
    font-size: 14px;
    line-height: 1.5;
    background:
      radial-gradient(1200px 700px at 4% -8%, #e6fff4 0%, rgba(230, 255, 244, 0) 58%),
      radial-gradient(1050px 750px at 92% -4%, #e9f5ff 0%, rgba(233, 245, 255, 0) 54%),
      radial-gradient(1000px 800px at 50% 112%, #fff7e8 0%, rgba(255, 247, 232, 0) 55%),
      linear-gradient(145deg, #f4fcf8 0%, #f0faff 45%, #fffaef 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }
  ::selection { background: #baf0dc; color: #173b33; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  svg { display: block; }
  h1, h2, h3, p { margin: 0; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid rgba(55, 167, 135, .44); outline-offset: 2px; }
  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0);
    white-space: nowrap; border: 0;
  }

  /* ---------- ambient doodles ---------- */
  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .ambient::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .34;
    background-image: radial-gradient(rgba(109, 169, 155, .22) .7px, transparent .7px);
    background-size: 19px 19px;
    mask-image: linear-gradient(to bottom, #000 0%, transparent 34%, transparent 74%, #000 100%);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 34%, transparent 74%, #000 100%);
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(14px);
    opacity: .55;
    animation: ambient-drift 16s var(--ease-out) infinite alternate;
  }
  .blob-a { width: 380px; height: 380px; left: -150px; top: 20%; background: #c9f7e4; animation-delay: -4s; }
  .blob-b { width: 460px; height: 460px; right: -190px; top: 38%; background: #cfe8ff; animation-delay: -9s; }
  .blob-c { width: 340px; height: 340px; left: 26%; bottom: -200px; background: #fff0c6; animation-delay: -2s; }
  .doodle {
    position: absolute;
    font-size: 20px;
    opacity: .48;
    animation: bob 7s ease-in-out infinite;
    user-select: none;
  }
  .doodle-1 { left: 3.2%; top: 31%; transform: rotate(-12deg); animation-delay: -2s; }
  .doodle-2 { right: 4.4%; top: 26%; font-size: 17px; transform: rotate(10deg); animation-delay: -4s; }
  .doodle-3 { left: 7%; bottom: 9%; font-size: 15px; animation-delay: -1s; }
  .doodle-4 { right: 8%; bottom: 14%; font-size: 22px; animation-delay: -5s; }
  .doodle-5 { left: 48%; top: 10%; font-size: 13px; opacity: .36; }
  .ambient-ring {
    position: absolute;
    width: 210px; height: 210px;
    border: 1.5px dashed rgba(112, 181, 164, .26);
    border-radius: 50%;
    right: -58px; top: 38%;
    animation: slow-spin 48s linear infinite;
  }
  .ambient-ring::before {
    content: "✦";
    position: absolute;
    top: 12px; left: 42px;
    color: #83cdb8;
    font-size: 11px;
  }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 20px;
    padding: 14px clamp(20px, 3.6vw, 52px) 12px;
    background: linear-gradient(to bottom, rgba(248, 253, 250, .94), rgba(248, 253, 250, .66));
    border-bottom: 1px solid rgba(255, 255, 255, .8);
    backdrop-filter: blur(22px) saturate(135%);
    -webkit-backdrop-filter: blur(22px) saturate(135%);
  }
  .topbar::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(141, 196, 181, .26), transparent);
    pointer-events: none;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    justify-self: start;
    min-width: 0;
    user-select: none;
  }
  .brand-mark {
    position: relative;
    width: 44px; height: 44px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border-radius: 15px;
    background: linear-gradient(145deg, #d9faec, #c7eaff);
    border: 1.5px solid rgba(255, 255, 255, .95);
    box-shadow: 0 8px 18px rgba(72, 138, 122, .14), inset 0 1px 0 rgba(255, 255, 255, .9);
  }
  .brand-mark svg { width: 34px; height: 34px; }
  .brand-mark::after {
    content: "✦";
    position: absolute;
    right: -5px; top: -7px;
    font-size: 12px;
    color: #5bb59a;
    transform: rotate(12deg);
    text-shadow: 0 0 10px rgba(255, 255, 255, .9);
  }
  .brand-copy { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .brand-name {
    font-family: var(--display);
    font-weight: 850;
    font-size: 18px;
    letter-spacing: -.025em;
    line-height: 1.1;
    color: var(--ink);
    white-space: nowrap;
  }
  .brand-name em { font-style: normal; color: #37a88a; }
  .brand-sub {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    color: #92a8a5;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .tab-switch {
    position: relative;
    justify-self: center;
    display: flex;
    width: 252px;
    max-width: 40vw;
    padding: 5px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .95);
    background: rgba(255, 255, 255, .72);
    box-shadow: 0 10px 26px rgba(65, 111, 102, .09), inset 0 1px 0 #fff;
    isolation: isolate;
  }
  .tab-glider {
    position: absolute;
    z-index: 0;
    top: 5px;
    bottom: 5px;
    left: 5px;
    width: calc(50% - 5px);
    border-radius: 999px;
    background: linear-gradient(128deg, #c7f7e2 0%, #c9eaff 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .95), 0 6px 14px rgba(61, 144, 124, .16);
    transition: transform .38s var(--ease-spring);
  }
  .tab-switch.is-projects .tab-glider { transform: translateX(100%); }
  .tab {
    position: relative;
    z-index: 1;
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    height: 38px;
    padding: 0 12px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: #829795;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .01em;
    cursor: pointer;
    white-space: nowrap;
    transition: color .24s ease;
  }
  .tab svg { width: 16px; height: 16px; opacity: .78; transition: opacity .24s ease; }
  .tab[aria-selected="true"] { color: #24423e; }
  .tab[aria-selected="true"] svg { opacity: 1; }
  .tab:hover { color: #355b54; }
  .tab-count {
    display: inline-grid;
    min-width: 19px;
    height: 19px;
    place-items: center;
    padding: 0 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .62);
    color: #6f8984;
    font-family: var(--display);
    font-size: 10px;
    font-weight: 800;
    line-height: 1;
  }
  .tab[aria-selected="true"] .tab-count { background: rgba(255, 255, 255, .74); color: #2f7563; }

  .top-actions {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }
  .team-pill {
    display: flex;
    align-items: center;
    height: 38px;
    padding: 0 12px 0 7px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .92);
    background: rgba(255, 255, 255, .62);
    box-shadow: var(--shadow-xs);
  }
  .team-pill .avatar { margin-left: -6px; }
  .team-pill .avatar:first-child { margin-left: 0; }
  .team-label {
    margin-left: 8px;
    font-size: 10.5px;
    font-weight: 650;
    color: #819794;
    white-space: nowrap;
  }
  .icon-btn {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    border: 1px solid rgba(255, 255, 255, .92);
    background: rgba(255, 255, 255, .62);
    color: #849996;
    box-shadow: var(--shadow-xs);
    cursor: pointer;
    transition: transform .2s var(--ease-out), background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn:hover { background: #fff; color: var(--mint-deep); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .icon-btn.is-armed { background: #fff4e1; color: #a37124; border-color: #ffe4b2; }

  /* ---------- avatars ---------- */
  .avatar {
    --a: #bcebd9;
    position: relative;
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    display: inline-grid;
    place-items: center;
    border-radius: 50%;
    border: 2px solid #fff;
    background: var(--a);
    box-shadow: 0 2px 6px rgba(55, 100, 92, .12);
    font-size: 15px;
    line-height: 1;
    user-select: none;
  }
  .avatar-sm { width: 24px; height: 24px; font-size: 12px; border-width: 1.5px; }
  .avatar-lg { width: 42px; height: 42px; font-size: 21px; border-width: 2.5px; }
  .avatar-stack { display: inline-flex; align-items: center; }
  .avatar-stack .avatar { margin-left: -7px; }
  .avatar-stack .avatar:first-child { margin-left: 0; }
  .avatar-stack .avatar:hover { transform: translateY(-2px); z-index: 1; }
  .avatar { transition: transform .2s var(--ease-out); }

  /* ---------- shared bits ---------- */
  main { position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view { animation: view-in .38s var(--ease-out) both; }
  .view[hidden] { display: none !important; }
  .page-wrap {
    width: min(1420px, 100%);
    margin: 0 auto;
    padding: 20px clamp(20px, 3.6vw, 52px) 26px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 28px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .95);
    background: rgba(255, 255, 255, .56);
    box-shadow: 0 3px 10px rgba(64, 112, 103, .04);
    color: #5f847c;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: .035em;
    white-space: nowrap;
  }
  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #44c39b;
    box-shadow: 0 0 0 4px rgba(68, 195, 155, .13);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .eyebrow-sep { width: 1px; height: 10px; background: #cfe0db; }
  .view-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 20px;
  }
  .view-head-copy { min-width: 0; }
  .view-head h1 {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 2px 10px;
    margin: 12px 0 7px;
    font-family: var(--display);
    font-size: clamp(27px, 2.55vw, 37px);
    line-height: 1.22;
    letter-spacing: -.035em;
    font-weight: 850;
    color: #1f3b38;
  }
  .highlight {
    position: relative;
    display: inline-block;
    padding: 0 .06em;
    color: #21775f;
  }
  .highlight::after {
    content: "";
    position: absolute;
    z-index: -1;
    left: -.02em; right: -.02em; bottom: .05em;
    height: .34em;
    border-radius: 99px;
    background: linear-gradient(90deg, #bff1de, #d7edff);
    transform: rotate(-1.2deg);
  }
  .title-sticker {
    display: inline-grid;
    place-items: center;
    width: 39px;
    height: 39px;
    margin-left: 2px;
    border-radius: 13px;
    border: 1.5px solid #fff;
    background: rgba(255, 255, 255, .72);
    box-shadow: 0 7px 18px rgba(74, 127, 116, .12);
    font-size: 20px;
    transform: rotate(7deg);
    transition: transform .3s var(--ease-spring);
  }
  .view-head h1:hover .title-sticker { transform: rotate(-7deg) scale(1.08); }
  .view-head-copy > p {
    font-size: 12.5px;
    color: #829793;
    letter-spacing: .015em;
  }
  .view-head-side {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 0 0 auto;
    padding-bottom: 2px;
  }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    height: 40px;
    padding: 0 16px;
    border-radius: 13px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-soft);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: .01em;
    white-space: nowrap;
    cursor: pointer;
    transition: transform .2s var(--ease-out), background .2s ease, border-color .2s ease, box-shadow .2s ease, color .2s ease;
  }
  .btn svg { width: 16px; height: 16px; flex: 0 0 auto; }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0) scale(.985); }
  .btn-primary {
    color: #fff;
    background: linear-gradient(135deg, #35a284 0%, #227d66 100%);
    box-shadow: 0 10px 22px rgba(37, 133, 107, .24), inset 0 1px 0 rgba(255, 255, 255, .22);
  }
  .btn-primary:hover { background: linear-gradient(135deg, #3cae8f 0%, #268770 100%); box-shadow: 0 14px 28px rgba(37, 133, 107, .28), inset 0 1px 0 rgba(255, 255, 255, .25); }
  .btn-lg { height: 46px; padding: 0 20px; border-radius: 15px; font-size: 13px; }
  .btn-lg svg { width: 17px; height: 17px; }
  .btn-ghost { background: #f1f8f5; color: #506a66; border-color: #e8f2ef; }
  .btn-ghost:hover { background: #e9f5f0; }
  .btn-soft { background: #fff; border-color: var(--line); color: #4d6661; box-shadow: var(--shadow-xs); }
  .btn-soft:hover { border-color: #cee5de; background: #fdfffe; }
  .btn-danger { color: var(--danger); background: #fff2f4; border-color: #ffe4e8; }
  .btn-danger:hover { background: #ffeaee; }
  .btn-danger.is-armed { background: #ffe2e7; border-color: #ffc6d0; color: #a93d4f; }

  /* ---------- task hero ---------- */
  .view-tasks {
    flex: 1;
    min-height: 640px;
    display: flex;
    flex-direction: column;
  }
  .view-tasks .page-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    width: 100%;
  }
  .progress-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 11px;
    height: 56px;
    padding: 6px 16px 6px 7px;
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, .95);
    background: rgba(255, 255, 255, .64);
    box-shadow: var(--shadow-sm);
  }
  .donut { position: relative; width: 44px; height: 44px; flex: 0 0 auto; }
  .donut svg { width: 44px; height: 44px; transform: rotate(-90deg); }
  .donut-track { fill: none; stroke: #e8f2ef; stroke-width: 5; }
  .donut-arc {
    fill: none;
    stroke: url(#donutGradient);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 113.1;
    stroke-dashoffset: 34;
    transition: stroke-dashoffset .7s var(--ease-out);
  }
  .donut-pct {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: var(--display);
    font-size: 10.5px;
    font-weight: 850;
    color: #357b68;
    letter-spacing: -.03em;
  }
  .progress-copy { display: flex; flex-direction: column; gap: 1px; }
  .progress-copy strong { font-family: var(--display); font-size: 12.5px; font-weight: 800; letter-spacing: -.015em; color: #34504b; }
  .progress-copy span { font-size: 10.5px; color: #91a4a0; white-space: nowrap; }
  .progress-copy b { color: #3f9a7f; font-weight: 750; }

  /* ---------- board toolbar ---------- */
  .board-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 13px;
    flex: 0 0 auto;
  }
  .board-ident { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .board-badge {
    width: 36px; height: 36px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    border: 1.5px solid #fff;
    background: rgba(255, 255, 255, .72);
    box-shadow: 0 4px 12px rgba(65, 113, 104, .08);
    font-size: 18px;
  }
  .board-ident strong { display: block; font-family: var(--display); font-size: 13.5px; font-weight: 800; letter-spacing: -.01em; color: #35524d; }
  .board-ident small { display: block; margin-top: 1px; font-size: 10.5px; color: #91a4a0; }
  .board-tools { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .people-filter {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 38px;
    padding: 3px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .95);
    background: rgba(255, 255, 255, .58);
    box-shadow: var(--shadow-xs);
  }
  .people-filter .p-filter {
    position: relative;
    width: 30px;
    height: 30px;
    display: inline-grid;
    place-items: center;
    padding: 0;
    border: 1.5px solid transparent;
    border-radius: 50%;
    background: transparent;
    font-size: 14px;
    cursor: pointer;
    transition: transform .2s var(--ease-spring), background .2s ease, border-color .2s ease;
  }
  .people-filter .p-filter:hover { background: #fff; transform: translateY(-1px) scale(1.06); }
  .people-filter .p-filter[aria-pressed="true"] {
    background: #fff;
    border-color: #b9e5d7;
    box-shadow: 0 3px 9px rgba(56, 124, 107, .15);
    transform: scale(1.04);
  }
  .people-filter .p-filter.all {
    width: auto;
    padding: 0 9px;
    border-radius: 999px;
    font-family: var(--display);
    font-size: 10.5px;

  .form-footer .btn { height: 38px; }

  /* ---------- task modal ---------- */
  .task-form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .task-form-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex: 0 0 auto;
    padding: 20px 26px 13px;
    border-bottom: 1px solid #eef5f2;
    background: linear-gradient(to bottom, #fff, #fbfefd);
  }
  .task-form-head h2 {
    margin-top: 3px;

    font-size: 20px;
    font-weight: 850;
    letter-spacing: -.03em;
    color: #2c4641;
  }
  .task-form-body {
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 16px 26px 20px;
    display: flex;
    flex-direction: column;
    gap: 13px;
    scrollbar-width: thin;
    scrollbar-color: #cde4de transparent;
  }
  .task-form-body::-webkit-scrollbar { width: 5px; }
  .task-form-body::-webkit-scrollbar-thumb { background: #cde4de; border-radius: 99px; }
  .task-form-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex: 0 0 auto;
    padding: 12px 26px;
    border-top: 1px solid #edf4f1;
    background: rgba(255, 255, 255, .88);

  .task-form-footer .btn { height: 38px; }
  .task-form .textarea { min-height: 74px; }
  .checklist-editor { border: 1.5px solid #edf3f0; border-radius: 13px; background: #fbfefd; padding: 9px 10px; }
  .checklist-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .checklist-head strong { font-size: 10px; font-weight: 750; color: #5c746e; }
  .checklist-head span { font-family: var(--display); font-size: 9px; color: #9aadaa; font-weight: 800; }
  .checklist-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .checklist-row { display: flex; align-items: center; gap: 7px; min-height: 28px; border-radius: 7px; padding: 1px 2px; }
  .checklist-row:hover { background: #f5fbf8; }
  .check-toggle {
    width: 18px; height: 18px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    padding: 0;
    border: 1.5px solid #d5e6df;
    border-radius: 6px;
    background: #fff;
    color: transparent;
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease, color .18s ease;
  }
  .check-toggle svg { width: 11px; height: 11px; }
  .check-toggle[aria-pressed="true"] { border-color: #66bda2; background: #66bda2; color: #fff; }
  .checklist-row .check-text { flex: 1; font-size: 10.5px; line-height: 1.45; color: #617772; word-break: break-word; }
  .checklist-row .check-text.is-checked { color: #a3b3af; text-decoration: line-through; text-decoration-color: #bdd8d0; }
  .check-remove {
    width: 22px; height: 22px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #b0bfbc;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s ease, background .15s ease, color .15s ease;
  }
  .checklist-row:hover .check-remove, .check-remove:focus-visible { opacity: 1; }
  .check-remove:hover { background: #fff1f3; color: #c55b65; }
  .check-remove svg { width: 12px; height: 12px; }
  .checklist-empty { padding: 4px 3px 2px; color: #a4b4b0; font-size: 9.5px; }
  .checklist-add { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .checklist-add input {
    flex: 1;
    height: 30px;
    padding: 0 8px;
    border: 1px solid #e7f0ed;
    border-radius: 8px;
    background: #fff;
    font-size: 10px;
    color: #4b625c;
    outline: none;
  }
  .checklist-add input:focus { border-color: #9edcc9; box-shadow: 0 0 0 3px rgba(158, 220, 201, .16); }
  .checklist-add button {
    width: 30px; height: 30px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: #edf8f4;
    color: #4c9c84;
    cursor: pointer;
  }
  .checklist-add button:hover { background: #e1f5ed; }
  .checklist-add button svg { width: 14px; height: 14px; }
  .modal-task-note {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 9px;
    background: #f5fbf8;
    color: #94a9a3;
    font-size: 9px;
  }

  /* ---------- toast & confetti ---------- */
  #toast {
    position: fixed;
    z-index: 300;
    left: 50%;
    bottom: 26px;
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: calc(100vw - 40px);
    padding: 10px 17px 10px 13px;
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 999px;
    background: #27443f;
    color: #f3fffa;
    box-shadow: 0 18px 42px rgba(26, 61, 53, .26);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .01em;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, 15px) scale(.97);
    transition: opacity .26s var(--ease-out), transform .3s var(--ease-spring);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #toast .toast-emoji { font-size: 14px; }
  #confetti-host { position: fixed; inset: 0; z-index: 250; pointer-events: none; overflow: hidden; }
  .confetti {
    position: absolute;
    left: var(--x0);
    top: var(--y0);
    width: var(--w, 8px);
    height: var(--h, 8px);
    border-radius: var(--r, 3px);
    background: var(--c, #8de3c4);
    opacity: 0;
    animation: confetti-burst .95s cubic-bezier(.17, .84, .44, 1) forwards;
    animation-delay: var(--delay, 0ms);
  }

  /* ---------- empty page demo reset ---------- */
  .reset-toast-note { display: none; }

  /* ---------- motion ---------- */
  @keyframes ambient-drift {
    from { transform: translate3d(0, -18px, 0) scale(1); }
    to { transform: translate3d(18px, 24px, 0) scale(1.06); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-7deg); }
    50% { transform: translateY(-8px) rotate(2deg); }
  }
  @keyframes slow-spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(68, 195, 155, .12); }
    50% { box-shadow: 0 0 0 6px rgba(68, 195, 155, .06); }
  }
  @keyframes card-pop {
    from { opacity: 0; transform: translateY(8px) scale(.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes view-in {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sheet-pop {
    from { opacity: 0; transform: translateY(18px) scale(.975); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes confetti-burst {
    0% { opacity: 1; transform: translate(0, 0) rotate(0) scale(1); }
    72% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.7); }
  }

    .column { flex: 0 0 min(82vw, 304px); scroll-snap-align: start; border-radius: 19px; }

  /* =========================================================
     ★ COSMIC THEME OVERRIDES ★
     A neon, after-hours task club floating somewhere near Mars.
     ========================================================= */
  :root {
    --ink: #f7f2ff;
    --ink-soft: #ded5f4;
    --muted: #a89dc5;
    --faint: #7e739b;
    --canvas: #0d0b1c;
    --paper: #17122d;
    --glass: rgba(23, 18, 45, .72);
    --glass-strong: rgba(27, 21, 52, .9);
    --line: rgba(255, 255, 255, .09);
    --line-strong: rgba(216, 255, 102, .24);
    --mint: #d8ff66;
    --mint-soft: rgba(216, 255, 102, .13);
    --mint-deep: #d8ff66;
    --mint-ink: #141022;
    --sky: #79e5ff;
    --sky-soft: rgba(121, 229, 255, .13);
    --lav: #b18cff;
    --lav-soft: rgba(177, 140, 255, .15);
    --lemon: #ffe98a;
    --lemon-soft: rgba(255, 233, 138, .12);
    --peach: #ffb86b;
    --rose: #ff8ad8;
    --coral: #ff9b7d;
    --danger: #ff8296;
    --shadow-xs: 0 1px 2px rgba(0, 0, 0, .24);
    --shadow-sm: 0 5px 16px rgba(0, 0, 0, .25), 0 1px 3px rgba(0, 0, 0, .2);
    --shadow-md: 0 18px 38px rgba(0, 0, 0, .3), 0 4px 12px rgba(0, 0, 0, .18);
    --shadow-lg: 0 40px 100px rgba(0, 0, 0, .62), 0 10px 30px rgba(0, 0, 0, .4);
    --display: "Avenir Next", "Futura", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --ease-out: cubic-bezier(.22, 1, .36, 1);
    --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  html { color-scheme: dark; }
  body {
    color: var(--ink);
    background:
      radial-gradient(980px 760px at 3% -8%, rgba(114, 66, 255, .33) 0%, rgba(114, 66, 255, 0) 58%),
      radial-gradient(1050px 800px at 99% 0%, rgba(255, 72, 176, .19) 0%, rgba(255, 72, 176, 0) 54%),
      radial-gradient(1100px 850px at 48% 116%, rgba(35, 218, 210, .14) 0%, rgba(35, 218, 210, 0) 56%),
      linear-gradient(158deg, #0b0917 0%, #100c22 46%, #090816 100%);
    background-attachment: fixed;
  }
  ::selection { background: #d8ff66; color: #141022; }
  :focus-visible { outline-color: rgba(216, 255, 102, .58); }

  /* --- cosmic backdrop --- */
  .ambient::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .72;
    background-image:
      radial-gradient(circle, rgba(255, 255, 255, .85) 0 1px, transparent 1.4px),
      radial-gradient(circle, rgba(216, 255, 102, .55) 0 1px, transparent 1.5px),
      radial-gradient(circle, rgba(121, 229, 255, .65) 0 1px, transparent 1.4px);
    background-size: 260px 240px, 370px 330px, 430px 380px;
    background-position: 17px 31px, 83px 139px, 34px 74px;
    mask-image: linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, .55) 62%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, .55) 62%, transparent 100%);
  }
  .ambient::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .18;
    background-image:
      linear-gradient(rgba(255, 255, 255, .16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .16) 1px, transparent 1px);
    background-size: 84px 84px;
    mask-image: radial-gradient(ellipse at 50% 90%, #000 0%, transparent 68%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 90%, #000 0%, transparent 68%);
  }
  .blob { filter: blur(90px); opacity: .55; }
  .blob-a { background: #6e3dff; }
  .blob-b { background: #ff4aa8; opacity: .32; }
  .blob-c { background: #27e0c3; opacity: .26; }
  .ambient-ring { border-color: rgba(216, 255, 102, .17); }
  .ambient-ring::before { color: #d8ff66; text-shadow: 0 0 14px rgba(216, 255, 102, .7); }
  .doodle { color: #d8ff66; opacity: .55; text-shadow: 0 0 18px rgba(216, 255, 102, .35); }
  .doodle-2 { color: #ff8ad8; text-shadow: 0 0 18px rgba(255, 138, 216, .45); }
  .doodle-3 { opacity: .6; filter: drop-shadow(0 0 12px rgba(255, 138, 216, .35)); }
  .doodle-4 { opacity: .48; filter: drop-shadow(0 0 10px rgba(255, 184, 107, .3)); }
  .doodle-5 { color: #79e5ff; }
  .meteor {
    position: absolute;
    width: 160px;
    height: 1px;
    border-radius: 99px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(216, 255, 102, .8));
    transform: rotate(-26deg);
    opacity: 0;
    animation: meteor-fall 10s linear infinite;
  }
  .meteor::after {
    content: "";
    position: absolute;
    right: -1px;
    top: -1.5px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #f4ffe2;
    box-shadow: 0 0 10px #d8ff66;
  }
  .meteor-1 { left: 67%; top: 16%; animation-delay: 2.5s; }
  .meteor-2 { left: 8%; top: 55%; width: 110px; animation-delay: 7.6s; }
  .orbit-line {
    position: absolute;
    left: -16%;
    bottom: -44%;
    width: 120vw;
    height: 72vh;
    border: 1px solid rgba(177, 140, 255, .16);
    border-radius: 50%;
    transform: rotate(-9deg);
    box-shadow: 0 0 70px rgba(120, 76, 255, .08) inset;
  }
  .orbit-line::after {
    content: "";
    position: absolute;
    top: 24%;
    right: 6%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff8ad8;
    box-shadow: 0 0 18px rgba(255, 138, 216, .8);
  }

  /* --- floating glass header --- */
  .topbar {
    position: sticky;
    top: 12px;
    width: min(1330px, calc(100% - 28px));
    margin: 12px auto 0;
    padding: 11px 18px;
    border: 1px solid rgba(255, 255, 255, .11);
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(26, 21, 50, .9), rgba(16, 12, 33, .78));
    box-shadow: 0 20px 48px rgba(3, 1, 14, .48), inset 0 1px 0 rgba(255, 255, 255, .07);
    backdrop-filter: blur(26px) saturate(150%);
    -webkit-backdrop-filter: blur(26px) saturate(150%);
  }
  .topbar::after {
    left: 8%;
    right: 8%;
    bottom: -1px;
    background: linear-gradient(90deg, transparent, rgba(216, 255, 102, .3), rgba(121, 229, 255, .24), transparent);
  }
  .brand-mark {
    background: linear-gradient(145deg, #241b45, #110e22);
    border-color: rgba(216, 255, 102, .42);
    box-shadow: 0 0 26px rgba(216, 255, 102, .16), inset 0 1px 0 rgba(255, 255, 255, .1);
  }
  .brand-mark::after { content: "✧"; color: #ff8ad8; text-shadow: 0 0 12px rgba(255, 138, 216, .75); }
  .brand-name { color: #fbf8ff; }
  .brand-name em { color: var(--mint); text-shadow: 0 0 14px rgba(216, 255, 102, .45); }
  .brand-sub { color: #897fa6; letter-spacing: .15em; }

  .tab-switch {
    width: 260px;
    background: rgba(8, 6, 20, .58);
    border-color: rgba(255, 255, 255, .09);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 10px 26px rgba(0, 0, 0, .22);
  }
  .tab-glider {
    background: linear-gradient(120deg, #d8ff66 0%, #79e5ff 100%);
    box-shadow: 0 0 24px rgba(190, 255, 122, .25), inset 0 1px 0 rgba(255, 255, 255, .62);
  }
  .tab { color: #978caf; }
  .tab:hover { color: #d8cee9; }
  .tab[aria-selected="true"] { color: #121021; }
  .tab[aria-selected="true"] svg { opacity: 1; }
  .tab-count { background: rgba(255, 255, 255, .07); color: #a99ec3; }
  .tab[aria-selected="true"] .tab-count { background: rgba(10, 8, 20, .14); color: #171328; }

  .team-pill, .icon-btn {
    background: rgba(255, 255, 255, .045);
    border-color: rgba(255, 255, 255, .09);
    box-shadow: none;

  /* =========================================================
     Utilities
     ========================================================= */
  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

  function uid(prefix = "id") {
    return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
  }

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    }[char]));
  }

  function personById(id) {
    return PEOPLE.find((person) => person.id === id) || PEOPLE[0];
  }

  function tagById(id) {
    return TAGS.find((tag) => tag.id === id) || TAGS[0];
  }

  function priorityById(id) {
    return PRIORITIES.find((item) => item.id === id) || PRIORITIES[0];
  }

  function statusById(id) {
    return STATUSES.find((item) => item.id === id) || STATUSES[0];
  }

  function coverById(index) {
    const value = Number(index);
    return COVERS[(Number.isFinite(value) ? value : 0) % COVERS.length];
  }

  function avatar(person, size = "") {
    const p = person || PEOPLE[0];
    return `<span class="avatar ${size}" style="--a:${p.color}" title="${esc(p.name)} · ${esc(p.role)}"><span aria-hidden="true">${p.emoji}</span><span class="sr-only">${esc(p.name)}</span></span>`;
  }

  function avatarStack(ids, extraClass = "") {
    const clean = [...new Set((ids || []).filter(Boolean))];
    return `<span class="avatar-stack ${extraClass}">${clean.slice(0, 3).map((id) => avatar(personById(id), "avatar-sm")).join("")}</span>`;
  }

  function startOfToday() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function dateOffset(days) {
    const d = startOfToday();
    d.setDate(d.getDate() + days);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function parseDate(iso) {
    if (!iso) return null;
    const parts = String(iso).split("-").map(Number);
    if (parts.length !== 3 || parts.some((part) => !Number.isFinite(part))) return null;
    const date = new Date(parts[0], parts[1] - 1, parts[2]);
    if (Number.isNaN(date.getTime())) return null;
    return date;
  }

  function diffDays(iso) {
    const date = parseDate(iso);
    if (!date) return null;
    return Math.round((date.getTime() - startOfToday().getTime()) / 86400000);
  }

  function shortDate(iso) {
    const date = parseDate(iso);
    if (!date) return "";
    return `${date.getMonth() + 1}/${date.getDate()}`;
  }

  function longDate(iso) {
    const date = parseDate(iso);
    if (!date) return "";
    return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
  }

  function dueMeta(iso, isDone = false) {
    const date = parseDate(iso);
    if (!date) return null;
    const diff = diffDays(iso);
    let label;
    let className = "";
    if (isDone) {
      label = shortDate(iso);
    } else if (diff < 0) {
      label = `逾期${Math.abs(diff)}天`;
      className = "is-overdue";
    } else if (diff === 0) {
      label = "今天";
      className = "is-soon";
    } else if (diff <= 2) {
      label = `剩${diff}天`;
      className = "is-soon";
    } else {
      label = shortDate(iso);
    }
    return { label, className, diff, long: longDate(iso), date };
  }

  function projectDueMeta(project) {
    const date = parseDate(project.due);
    if (!date) return { label: "未设置日期", className: "", short: "", diff: null };
    const diff = diffDays(project.due);
    if (project.status === "done") {
      return { label: "已完成", className: "done", short: shortDate(project.due), diff, date };
    }
    if (diff < 0) return { label: `逾期 ${Math.abs(diff)} 天`, className: "overdue", short: `${shortDate(project.due)} 截止`, diff, date };
    if (diff === 0) return { label: "今天截止", className: "soon", short: "今天截止", diff, date };
    if (diff <= 3) return { label: `还剩 ${diff} 天`, className: "soon", short: `${shortDate(project.due)} 截止`, diff, date };
    return { label: `${shortDate(project.due)} 截止`, className: "", short: `${shortDate(project.due)} 截止`, diff, date };
  }

  function extOf(name) {
    const parts = String(name || "").split(".");
    if (parts.length < 2) return "FILE";
    return parts.pop().slice(0, 4).toUpperCase() || "FILE";
  }

  function docKind(ext) {
    const value = String(ext || "").toLowerCase();
    if (value === "pdf") return "pdf";
    if (["png", "jpg", "jpeg", "gif", "webp", "svg", "heic"].includes(value)) return "img";
    if (["doc", "docx", "pages", "txt", "md", "rtf"].includes(value)) return "doc";
    if (["zip", "rar", "7z", "tar", "gz"].includes(value)) return "zip";
    return "file";
  }

  function formatSize(bytes) {
    const size = Number(bytes) || 0;
    if (size < 1024) return `${size} B`;
    if (size < 1024 * 1024) return `${(size / 1024).toFixed(size < 10240 ? 1 : 0)} KB`;
    return `${(size / (1024 * 1024)).toFixed(1)} MB`;
  }

  function optionList(items, selected) {
    return items.map((item) => {
      const value = typeof item === "string" ? item : item.value;
      const label = typeof item === "string" ? item : item.label;
      return `<option value="${esc(value)}"${String(value) === String(selected) ? " selected" : ""}>${esc(label)}</option>`;
    }).join("");
  }

  function todayLabel() {
    const d = new Date();
    const week = ["日", "一", "二", "三", "四", "五", "六"];
    return `${d.getMonth() + 1}月${d.getDate()}日 · 周${week[d.getDay()]}`;
  }

  function clamp(number, min, max) {
    return Math.min(max, Math.max(min, number));
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.tasks) || !Array.isArray(parsed.projects)) return null;
      return {
        tasks: parsed.tasks.map(normalizeTask),
        projects: parsed.projects.map(normalizeProject),
      };
    } catch (error) {
      console.warn("Kiwi Task House: failed to load saved state.", error);
      return null;
    }
  }

  function saveState() {
    try {
      const snapshot = {
        v: STATE_VERSION,
        tasks,
        projects: projects.map((project) => ({
          ...project,
          docs: (project.docs || []).map(({ _file, ...rest }) => rest),
        })),
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
    } catch (error) {
      console.warn("Kiwi Task House: failed to persist state.", error);
      toast("本地存不下这份记录，但页面里的改动还在", "🫧");
    }
  }

      if (!query) return true;
      const project = projectById(task.projectId);
      const haystack = [
        task.title,
        task.desc,
        tagById(task.tag).label,
        personById(task.owner).name,
        project ? project.name : "",
      ].join(" ").toLowerCase();
      return haystack.includes(query);

    const total = tasks.length;

    const circumference = 2 * Math.PI * 18;
    const arc = $("#donut-arc");
    if (arc) {

      arc.style.strokeDashoffset = String(circumference * (1 - percent / 100));
    }
    $("#donut-pct").textContent = `${percent}%`;
    $("#done-stat").textContent = total
      ? (done === total ? "全部完成，今天超棒！" : `已完成 ${done} / ${total} 件 · 慢慢来`)
      : "今天还没有任务哦";

  /* =========================================================
     Modal helpers
     ========================================================= */
  function setModalOpen(open) {
    isModalOpen = open;
    document.body.classList.toggle("modal-open", open);
    if (!open) {
      modalRoot.innerHTML = "";
      taskModal = null;
      projectModal = null;
    }
  }

  function openModalShell(content) {
    if (!isModalOpen) {
      lastFocused = document.activeElement instanceof HTMLElement ? document.activeElement : null;
    }
    modalRoot.innerHTML = content;
    setModalOpen(true);
  }

  function closeModal({ restoreFocus = true } = {}) {
    const target = lastFocused;
    closeDangerButtons();
    modalRoot.innerHTML = "";
    setModalOpen(false);
    lastFocused = null;
    if (restoreFocus && target && document.contains(target) && typeof target.focus === "function") {
      requestAnimationFrame(() => {
        if (document.contains(target)) target.focus({ preventScroll: true });
      });
    }
  }

  function focusFirst(selector) {
    requestAnimationFrame(() => {
      const element = $(selector, modalRoot);
      if (element) element.focus({ preventScroll: true });
    });
  }

  function closeDangerButtons() {
    $$("[data-armed='1']", modalRoot).forEach((button) => {
      button.dataset.armed = "0";
      button.classList.remove("is-armed");
      if (button._idleHtml) button.innerHTML = button._idleHtml;
      clearTimeout(button._dangerTimer);
    });
  }

  function confirmDanger(button) {
    if (button.dataset.armed === "1") {
      closeDangerButtons();
      return true;
    }
    closeDangerButtons();
    button._idleHtml = button.innerHTML;
    button.dataset.armed = "1";
    button.classList.add("is-armed");
    button.textContent = "再点一次确认";
    button._dangerTimer = setTimeout(() => {
      if (!button.isConnected) return;
      button.dataset.armed = "0";
      button.classList.remove("is-armed");
      if (button._idleHtml) button.innerHTML = button._idleHtml;
    }, 2800);
    return false;
  }

    const kind = docKind(doc.kind);
    return `<span class="doc-icon kind-${kind}">${esc((doc.kind || "FILE").slice(0, 4))}</span>`;
  }

    if (!projectModal) return "";
    const docs = projectModal.docs || [];

    return docs.map((doc) => `

  function refreshDocEditor() {
    const list = $("#doc-edit-list");
    const count = $("#doc-field-count");
    if (list) list.innerHTML = docEditorMarkup();
    if (count) count.textContent = `${(projectModal?.docs || []).length} 份`;
  }

  function addDraftDocs(fileList) {
    if (!projectModal) return;
    const incoming = [...fileList];
    if (!incoming.length) return;
    let added = 0;
    let skipped = 0;
    incoming.forEach((file) => {
      if (projectModal.docs.length >= 12) { skipped += 1; return; }
      if (file.size > 25 * 1024 * 1024) { skipped += 1; return; }
      const doc = {
        id: uid("doc"),
        name: file.name,
        size: file.size,
        kind: extOf(file.name),
        _file: file,
      };
      projectModal.docs.push(doc);
      added += 1;
    });
    refreshDocEditor();
    if (added && skipped) toast(`加入 ${added} 份文档，另有 ${skipped} 份超出限制`, "📎");
    else if (added) toast(`加入 ${added} 份文档，记得保存项目哦`, "📎");
    else toast("最多上传 12 份文档，每份不超过 25 MB", "☁️");
  }

  function downloadProjectDoc(docId) {
    if (!projectModal) return;
    const project = projects.find((item) => item.id === projectModal.id);
    const doc = project?.docs.find((item) => item.id === docId);
    if (!doc) return;
    if (doc._file) {
      const url = URL.createObjectURL(doc._file);
      const link = document.createElement("a");
      link.href = url;
      link.download = doc.name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 20000);
      toast(`开始下载「${doc.name}」`, "⬇️");
    } else {
      toast("这是示例资料，上传本地文件后就可以下载啦", "🫧");
    }
  }

  function saveProject(form) {
    if (!projectModal) return;
    const formData = new FormData(form);

    const owner = String(formData.get("owner") || "kiwi");

    const safeOwner = ownerExists ? owner : "kiwi";
    const memberSet = new Set(projectModal.members);
    memberSet.add(safeOwner);
    const due = String(formData.get("due") || "");
    const docs = projectModal.docs.map(({ _file, ...doc }) => ({ ...doc, _file }));
    const data = {
      name,
      tagline: String(formData.get("tagline") || "").trim(),
      status: String(formData.get("status") || "planning"),
      owner: safeOwner,
      members: [...memberSet].filter((id) => PEOPLE.some((person) => person.id === id)),
      due,
      progress: clamp(Number(formData.get("progress")) || 0, 0, 100),
      cover: projectModal.cover,
      emoji: projectModal.emoji,
      background: String(formData.get("background") || "").trim(),
      docs,
    };
    if (!STATUSES.some((status) => status.id === data.status)) data.status = "planning";
    const isNew = !projectModal.id;

      projectId = uid("project");

      Object.assign(project, data);

    renderProjectFilters();
    renderProjects();
    renderBoard();
    updateStats();

  function toast(message, emoji = "✦") {
    toastEl.innerHTML = `<span class="toast-emoji" aria-hidden="true">${emoji}</span><span>${esc(message)}</span>`;
    toastEl.classList.add("show");

  function burstConfetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const colors = ["#8fe0c5", "#ffc2d4", "#ffe49c", "#aed8ff", "#d8c9ff", "#ffc6a9"];
    const originX = window.innerWidth / 2;
    const originY = window.innerHeight * 0.56;
    for (let index = 0; index < 26; index += 1) {
      const piece = document.createElement("span");
      piece.className = "confetti";
      const angle = Math.random() * Math.PI * 2;
      const distance = 70 + Math.random() * 260;
      piece.style.setProperty("--x0", `${originX}px`);
      piece.style.setProperty("--y0", `${originY}px`);
      piece.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
      piece.style.setProperty("--dy", `${Math.sin(angle) * distance + 80}px`);
      piece.style.setProperty("--rot", `${Math.random() * 720 - 360}deg`);
      piece.style.setProperty("--c", colors[index % colors.length]);
      piece.style.setProperty("--w", `${5 + Math.random() * 7}px`);
      piece.style.setProperty("--h", `${5 + Math.random() * 7}px`);
      piece.style.setProperty("--r", Math.random() > 0.5 ? "50%" : "3px");
      piece.style.setProperty("--delay", `${Math.random() * 70}ms`);
      confettiHost.appendChild(piece);
      setTimeout(() => piece.remove(), 1200);
    }
  }

  /* =========================================================
     Drag and drop
     ========================================================= */
  function cleanupDrag() {
    draggedTaskId = null;
    $$(".task-card.dragging").forEach((card) => card.classList.remove("dragging"));
    $$(".drop-placeholder").forEach((placeholder) => placeholder.remove());
    $$(".column.drag-over").forEach((column) => column.classList.remove("drag-over"));
    $$(".task-list.is-drop-target").forEach((list) => list.classList.remove("is-drop-target"));
    setTimeout(() => { suppressClick = false; }, 60);
  }

  function dragAfterElement(list, y) {
    const cards = [...list.querySelectorAll(".task-card:not(.dragging)")];
    let closest = null;
    let closestOffset = Number.NEGATIVE_INFINITY;
    cards.forEach((card) => {
      const box = card.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closestOffset) {
        closestOffset = offset;
        closest = card;
      }
    });
    return closest;
  }

  function moveTask(taskId, targetColumn, beforeTaskId) {
    const task = tasks.find((item) => item.id === taskId);
    if (!task) return null;
    const fromColumn = task.col;
    if (!COLUMNS.some((column) => column.id === targetColumn)) return null;
    const remaining = tasks.filter((item) => item.id !== taskId);
    const moving = { ...task, col: targetColumn };
    if (beforeTaskId) {
      const index = remaining.findIndex((item) => item.id === beforeTaskId);
      if (index >= 0) remaining.splice(index, 0, moving);
      else remaining.push(moving);
    } else {
      let insertAt = remaining.length;
      for (let index = remaining.length - 1; index >= 0; index -= 1) {
        if (remaining[index].col === targetColumn) {
          insertAt = index + 1;
          break;
        }
      }
      remaining.splice(insertAt, 0, moving);
    }
    tasks = remaining;
    return { fromColumn, toColumn: targetColumn, task: moving };
  }

  /* =========================================================
     Event handlers
     ========================================================= */
  document.addEventListener("click", (event) => {
    const target = event.target;
    if (!(target instanceof Element)) return;

    const closeTrigger = target.closest("[data-close-modal]");
    if (closeTrigger) {
      closeModal();
      return;
    }

    if (target.closest("#brand-home")) {
      event.preventDefault();
      setTab("tasks");
      return;
    }

    const tab = target.closest(".tab[data-tab]");
    if (tab) {
      setTab(tab.dataset.tab);
      return;
    }

    const personButton = target.closest("[data-person]");
    if (personButton) {
      currentPerson = personButton.dataset.person || "all";
      syncPeopleFilter();
      renderBoard();
      return;
    }

    const projectFilterButton = target.closest("[data-project-filter]");
    if (projectFilterButton) {
      projectFilter = projectFilterButton.dataset.projectFilter || "all";
      syncProjectFilters();
      renderProjects();
      return;
    }

    if (target.closest("[data-clear-project-filters]")) {
      projectFilter = "all";
      projectQuery = "";
      const search = $("#project-search");
      if (search) search.value = "";
      syncProjectFilters();
      renderProjects();
      return;
    }

    if (target.closest("#new-task")) {
      openTaskModal();
      return;
    }

    const addColumn = target.closest("[data-add-col]");
    if (addColumn) {
      openTaskModal(null, addColumn.dataset.addCol);
      return;
    }

    if (target.closest("#new-project") || target.closest("[data-new-project]")) {
      openProjectModal();
      return;
    }

    if (target.closest("#reset-demo")) {
      handleReset();
      return;
    }

    if (target.closest("#project-edit")) {
      if (!projectModal) return;
      projectModal.mode = "edit";
      projectModal.docs = (projectById(projectModal.id)?.docs || []).map((doc) => ({ ...doc }));
      projectModal.members = [...(projectById(projectModal.id)?.members || [])];
      projectModal.cover = projectById(projectModal.id)?.cover ?? projectModal.cover;
      projectModal.emoji = projectById(projectModal.id)?.emoji ?? projectModal.emoji;
      renderProjectModal();
      return;
    }

    if (target.closest("#project-delete")) {
      const button = target.closest("#project-delete");
      if (!confirmDanger(button)) return;
      deleteCurrentProject();
      return;
    }

    if (target.closest("#task-delete")) {
      const button = target.closest("#task-delete");
      if (!confirmDanger(button)) return;
      deleteCurrentTask();
      return;
    }

    if (target.closest("[data-cancel-project]")) {
      if (projectModal?.id) {
        projectModal.mode = "view";
        projectModal.docs = (projectById(projectModal.id)?.docs || []).map((doc) => ({ ...doc }));
        renderProjectModal();
      } else {
        closeModal();
      }
      return;
    }

    const coverButton = target.closest("[data-cover]");
    if (coverButton && projectModal) {
      projectModal.cover = Number(coverButton.dataset.cover) || 0;
      const cover = coverById(projectModal.cover);
      $$("[data-cover]", modalRoot).forEach((button) => {
        button.setAttribute("aria-pressed", String(Number(button.dataset.cover) === projectModal.cover));
      });
      const preview = $("#cover-preview", modalRoot);
      if (preview) {
        preview.style.setProperty("--c1", cover.c1);
        preview.style.setProperty("--c2", cover.c2);
      }
      return;
    }

    const emojiButton = target.closest("[data-emoji]");
    if (emojiButton && projectModal) {
      projectModal.emoji = emojiButton.dataset.emoji || "🌈";
      $$("[data-emoji]", modalRoot).forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.emoji === projectModal.emoji));
      });
      const preview = $("#preview-emoji", modalRoot);
      if (preview) preview.textContent = projectModal.emoji;
      return;
    }

    const memberButton = target.closest("[data-member]");
    if (memberButton && projectModal) {
      const id = memberButton.dataset.member;
      if (projectModal.members.includes(id)) {
        projectModal.members = projectModal.members.filter((memberId) => memberId !== id);
      } else {
        projectModal.members.push(id);
      }
      memberButton.setAttribute("aria-pressed", String(projectModal.members.includes(id)));
      return;
    }

    const downloadButton = target.closest("[data-download-doc]");
    if (downloadButton) {
      downloadProjectDoc(downloadButton.dataset.downloadDoc);
      return;
    }

    const removeDocButton = target.closest("[data-remove-doc]");
    if (removeDocButton && projectModal) {
      projectModal.docs = projectModal.docs.filter((doc) => doc.id !== removeDocButton.dataset.removeDoc);
      refreshDocEditor();
      return;
    }

    const checkToggle = target.closest("[data-check-toggle]");
    if (checkToggle && taskModal) {
      const id = checkToggle.dataset.checkToggle;
      const item = taskModal.checklist.find((check) => check.id === id);
      if (!item) return;
      item.done = !item.done;
      checkToggle.setAttribute("aria-pressed", String(item.done));
      checkToggle.setAttribute("aria-label", item.done ? "取消完成" : "标记完成");
      const row = checkToggle.closest(".checklist-row");
      const text = row?.querySelector(".check-text");
      if (text) text.classList.toggle("is-checked", item.done);
      updateChecklistMeta();
      return;
    }

    const checkRemove = target.closest("[data-check-remove]");
    if (checkRemove && taskModal) {
      taskModal.checklist = taskModal.checklist.filter((item) => item.id !== checkRemove.dataset.checkRemove);
      refreshChecklistList();
      return;
    }

    if (target.closest("#add-check")) {
      addChecklistItem();
      return;
    }

    const taskCard = target.closest(".task-card");
    if (taskCard) {
      if (suppressClick) return;
      openTaskModal(taskCard.dataset.taskId);
      return;
    }

    const projectCard = target.closest(".project-card");
    if (projectCard) {
      openProjectModal(projectCard.dataset.projectId, "view");
      return;
    }
  });

  document.addEventListener("input", (event) => {
    const target = event.target;
    if (!(target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement)) return;
    if (target.id === "task-search") {
      taskQuery = target.value;
      renderBoard();
    } else if (target.id === "project-search") {
      projectQuery = target.value;
      renderProjects();
    }
  });

  document.addEventListener("change", (event) => {
    const target = event.target;
    if (!(target instanceof HTMLInputElement)) return;
    if (target.matches(".upload-zone input[type='file']")) {
      addDraftDocs(target.files);
      target.value = "";
    }
  });

  document.addEventListener("submit", (event) => {
    const form = event.target;
    if (!(form instanceof HTMLFormElement)) return;
    event.preventDefault();
    if (form.id === "project-form") saveProject(form);
    if (form.id === "task-form") saveTask(form);
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && isModalOpen) {
      event.preventDefault();
      closeModal();
      return;
    }

    if (isModalOpen && event.key === "Tab") {
      const sheet = $(".sheet", modalRoot);
      if (!sheet) return;
      const focusables = $$(
        'button, [href], input:not([type="hidden"]), select, textarea, [tabindex]:not([tabindex="-1"])',
        sheet
      ).filter((element) => !element.disabled && element.getClientRects().length > 0);
      if (!focusables.length) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (event.shiftKey && (document.activeElement === first || !sheet.contains(document.activeElement))) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && (document.activeElement === last || !sheet.contains(document.activeElement))) {
        event.preventDefault();
        first.focus();
      }
      return;
    }

    if ((event.metaKey || event.ctrlKey) && event.key === "Enter" && isModalOpen) {
      const form = $("form", modalRoot);
      if (form) {
        event.preventDefault();
        form.requestSubmit();
      }
      return;
    }

    if (event.key === "Enter" && event.target instanceof HTMLInputElement && event.target.id === "checklist-input") {
      event.preventDefault();
      addChecklistItem();
      return;
    }

    if (event.key === "/" && !isModalOpen) {
      const active = document.activeElement;
      const typing = active instanceof HTMLElement && (active.matches("input, textarea, select") || active.isContentEditable);
      if (!typing) {
        const search = activeTab === "tasks" ? $("#task-search") : $("#project-search");
        if (search) {
          event.preventDefault();
          search.focus();
        }
      }
      return;
    }

    if (activeTab === "tasks" && !isModalOpen && event.target instanceof Element) {
      const card = event.target.closest(".task-card");
      if (card && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        openTaskModal(card.dataset.taskId);
        return;
      }
    }

    if (activeTab === "projects" && !isModalOpen && event.target instanceof Element) {
      const projectCard = event.target.closest(".project-card");
      if (projectCard && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        openProjectModal(projectCard.dataset.projectId, "view");
        return;
      }
    }

    const focusedTab = event.target instanceof HTMLElement ? event.target.closest(".tab[data-tab]") : null;
    if (focusedTab) {
      const tabs = $$(".tab[data-tab]", $("#tab-switch"));
      const index = tabs.indexOf(focusedTab);
      if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
        event.preventDefault();
        const next = event.key === "ArrowRight" ? (index + 1) % tabs.length : (index - 1 + tabs.length) % tabs.length;
        setTab(tabs[next].dataset.tab, { focus: true });
      } else if (event.key === "Home" || event.key === "End") {
        event.preventDefault();
        setTab((event.key === "Home" ? tabs[0] : tabs[tabs.length - 1]).dataset.tab, { focus: true });
      }
    }
  });

  document.addEventListener("dragstart", (event) => {
    const card = event.target instanceof Element ? event.target.closest(".task-card") : null;
    if (!card) return;
    draggedTaskId = card.dataset.taskId;
    suppressClick = true;
    card.classList.add("dragging");
    if (event.dataTransfer) {
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", draggedTaskId);
    }
  });

  document.addEventListener("dragover", (event) => {
    const target = event.target instanceof Element ? event.target : null;
    if (!target) return;

    const uploadZone = target.closest(".upload-zone");
    if (uploadZone) {
      event.preventDefault();
      if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
      $$(".upload-zone.is-dragging").forEach((zone) => {
        if (zone !== uploadZone) zone.classList.remove("is-dragging");
      });
      uploadZone.classList.add("is-dragging");
      return;
    }

    if (!draggedTaskId) return;
    const taskList = target.closest(".task-list");
    if (!taskList) return;
    event.preventDefault();
    if (event.dataTransfer) event.dataTransfer.dropEffect = "move";

    $$(".column.drag-over").forEach((column) => column.classList.remove("drag-over"));
    taskList.closest(".column")?.classList.add("drag-over");
    $$(".task-list.is-drop-target").forEach((list) => {
      if (list !== taskList) list.classList.remove("is-drop-target");
    });
    taskList.classList.add("is-drop-target");

    let placeholder = $(".drop-placeholder", taskList);
    if (!placeholder) {
      placeholder = document.createElement("div");
      placeholder.className = "drop-placeholder";
      placeholder.setAttribute("aria-hidden", "true");
    }
    const after = dragAfterElement(taskList, event.clientY);
    if (after) taskList.insertBefore(placeholder, after);
    else taskList.appendChild(placeholder);
  });

  document.addEventListener("dragleave", (event) => {
    const target = event.target instanceof Element ? event.target.closest(".upload-zone") : null;
    if (target && !target.contains(event.relatedTarget)) target.classList.remove("is-dragging");
    const list = event.target instanceof Element ? event.target.closest(".task-list") : null;
    if (list && !list.contains(event.relatedTarget)) {
      $(".drop-placeholder", list)?.remove();
      list.closest(".column")?.classList.remove("drag-over");
      list.classList.remove("is-drop-target");
    }
  });

  document.addEventListener("drop", (event) => {
    const target = event.target instanceof Element ? event.target : null;
    if (!target) return;

    const uploadZone = target.closest(".upload-zone");
    if (uploadZone) {
      event.preventDefault();
      uploadZone.classList.remove("is-dragging");
      if (event.dataTransfer?.files?.length) addDraftDocs(event.dataTransfer.files);
      return;
    }

    const taskList = target.closest(".task-list");
    if (!taskList || !draggedTaskId) return;
    event.preventDefault();
    const placeholder = $(".drop-placeholder", taskList);
    let beforeTaskId = null;
    if (placeholder) {
      let next = placeholder.nextElementSibling;
      while (next && !next.matches(".task-card")) next = next.nextElementSibling;
      beforeTaskId = next?.dataset?.taskId || null;
    }
    const targetColumn = taskList.dataset.col;
    const taskId = draggedTaskId;
    const result = moveTask(taskId, targetColumn, beforeTaskId);
    cleanupDrag();
    if (!result) return;
    saveState();
    renderBoard();
    updateStats();
    if (result.fromColumn !== result.toColumn) {
      const columnName = COLUMNS.find((column) => column.id === result.toColumn)?.name || "";
      if (result.toColumn === "done") {
        toast("一颗星星安全抵达，正在发光", "⭐");
        burstConfetti();
      } else {
        toast(`已经驶入「${columnName}」`, "🛸");
      }
    }
  });

  document.addEventListener("dragend", () => {
    cleanupDrag();
  });

  function handleReset() {
    const button = $("#reset-demo");
    if (!resetArmed) {
      resetArmed = true;
      button.dataset.armed = "1";
      button.classList.add("is-armed");
      toast("再点一次，就会把星图恢复成最初的样子", "🛰️");
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => {
        resetArmed = false;
        if (button.isConnected) {
          button.dataset.armed = "0";
          button.classList.remove("is-armed");
        }
      }, 3000);
      return;
    }
    resetArmed = false;
    clearTimeout(resetTimer);
    button.dataset.armed = "0";
    button.classList.remove("is-armed");
    localStorage.removeItem(STORAGE_KEY);
    tasks = seedTasks();
    projects = seedProjects();
    currentPerson = "all";
    projectFilter = "all";
    taskQuery = "";
    projectQuery = "";
    const taskSearch = $("#task-search");
    const projectSearch = $("#project-search");
    if (taskSearch) taskSearch.value = "";
    if (projectSearch) projectSearch.value = "";
    closeModal({ restoreFocus: false });
    renderPeopleFilter();
    renderProjectFilters();
    renderBoard();
    renderProjects();
    updateStats();
    saveState();
    toast("星图已重新校准，继续探索吧", "🛸");
  }

  /* =========================================================
     Boot
     ========================================================= */
  const stored = loadState();
  tasks = stored ? stored.tasks : seedTasks();
  projects = stored ? stored.projects : seedProjects();
  if (!stored) saveState();

  const today = $("#today-label");
  if (today) today.textContent = todayLabel();

  renderTeam();
  renderPeopleFilter();
  renderProjectFilters();
  renderBoard();
  renderProjects();
  updateStats();
  setTab("tasks");

  document.addEventListener("dragover", (event) => {
    if (event.dataTransfer && [...event.dataTransfer.types].includes("Files")) event.preventDefault();
  });
  document.addEventListener("drop", (event) => {
    if (event.dataTransfer && [...event.dataTransfer.types].includes("Files") && !(event.target instanceof Element && event.target.closest(".upload-zone"))) {
      event.preventDefault();
    }
  });

  const taskSearchInput = $("#task-search");
  const projectSearchInput = $("#project-search");
  if (taskSearchInput) taskSearchInput.addEventListener("search", () => {
    taskQuery = taskSearchInput.value;
    renderBoard();
  });
  if (projectSearchInput) projectSearchInput.addEventListener("search", () => {
    projectQuery = projectSearchInput.value;
    renderProjects();
  });
})();
</script>
</body>
</html>
