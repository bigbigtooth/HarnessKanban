[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harvesstask-backend"
version = "0.1.0"
description = "HarnessKanban distributed multi-agent task system backend (Django WebAPI + FastAPI AgentAPI + Celery jobs)"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "celery[redis]>=5.6,<5.7",
    "redis>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyMySQL>=1.1",
    "oss2>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*", "domain*", "webapi*", "agentapi*", "jobs*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-p no:cacheprovider --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "unit: pure unit level checks without HTTP or database services",
    "api: HTTP adapter level checks over the real domain services",
    "identity: agent identity, key lifecycle and permission checks",
    "projects: project lifecycle, membership, context and documents",
    "workflow: task state machine and authoring checks",
    "claim: claim eligibility, level selection and atomic claim checks",
    "timeout: fixed timeout, progress, release and recovery checks",
    "review: submission, review, rework and history checks",
    "files: attachment and document access checks",
    "dashboard: statistics and scope checks",
    "jobs: celery scan, dispatch, consumer and cleanup checks",
    "mysql: requires a real MySQL server, never satisfied by SQLite",
    "concurrency: requires real concurrent connections/processes",
    "fault: injected failure and recovery checks",
    "deployment: process, proxy and shared storage configuration checks",
]

[tool.ruff]
line-length = 110
target-version = "py312"
